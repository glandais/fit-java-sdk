version: 2

updates:
  # Actions utilisées par fit-kmp-check.yml, fit-kmp-release.yml et publishToMaven.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    # Une seule PR par lot : les bumps d'actions sont indépendants les uns des
    # autres et ne méritent pas une PR chacun.
    groups:
      github-actions:
        patterns:
          - '*'

  # Build Gradle autonome de fit-kmp (plugins Kotlin/vanniktech et wrapper Gradle).
  # Le pom.xml à la racine est celui du SDK Java upstream : ce fork ne le republie
  # pas, donc pas d'écosystème maven ici.
  - package-ecosystem: gradle
    directory: /fit-kmp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      gradle:
        patterns:
          - '*'
